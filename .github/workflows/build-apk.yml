name: Compilar APK do Taxímetro

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install

      - name: Sincronizar projeto Android (Capacitor)
        run: npx cap sync android

      - name: Permitir execução do Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK de release (ainda sem assinatura)
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Assinar digitalmente o APK
        id: assinar_apk
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.TAXIMETRO_KEYSTORE_BASE64 }}
          alias: taximetro
          keyStorePassword: ${{ secrets.TAXIMETRO_KEYSTORE_SENHA }}
          keyPassword: ${{ secrets.TAXIMETRO_KEYSTORE_SENHA }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Publicar o APK pronto (como artefato do build)
        uses: actions/upload-artifact@v4
        with:
          name: taximetro-apk
          path: ${{ steps.assinar_apk.outputs.signedReleaseFile }}

      - name: Publicar o APK como Release (link direto, sem precisar de login)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-mais-recente
          name: Taxímetro — versão mais recente
          body: APK gerado automaticamente a cada atualização, assinado digitalmente. Baixe o arquivo .apk abaixo.
          files: ${{ steps.assinar_apk.outputs.signedReleaseFile }}
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
