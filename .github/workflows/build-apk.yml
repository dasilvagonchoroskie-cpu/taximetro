name: Compilar APK do Taxímetro

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Preparar Android SDK
        run: |
          # A acao android-actions/setup-android passou a falhar. A maquina
          # do GitHub ja vem com o SDK do Android instalado, entao basta
          # apontar para ele e aceitar as licencas.
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "ERRO: SDK do Android nao encontrado na maquina."
            exit 1
          fi
          echo "SDK em: $SDK"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          echo "licencas aceitas"


      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install

      - name: Carimbar a versao dentro do aplicativo
        run: |
          VERSAO=$(grep -m1 'versionName' android/app/build.gradle | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$VERSAO" ]; then echo "ERRO: nao achei o versionName"; exit 1; fi
          echo "versao: $VERSAO"
          sed -i "s/VERSAO_NA_MONTAGEM/$VERSAO/" www/index.html
          grep -c "const VERSAO_APP = '$VERSAO'" www/index.html

      - name: Sincronizar projeto Android (Capacitor)
        run: npx cap sync android

      - name: Permitir execução do Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK de release (ainda sem assinatura)
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Assinar digitalmente o APK
        id: assinar_apk
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.TAXIMETRO_KEYSTORE_BASE64 }}
          alias: taximetro
          keyStorePassword: ${{ secrets.TAXIMETRO_KEYSTORE_SENHA }}
          keyPassword: ${{ secrets.TAXIMETRO_KEYSTORE_SENHA }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Publicar o APK pronto (como artefato do build)
        uses: actions/upload-artifact@v4
        with:
          name: taximetro-apk
          path: ${{ steps.assinar_apk.outputs.signedReleaseFile }}

      - name: Publicar o APK como Release (link direto, sem precisar de login)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-mais-recente
          name: Taxímetro — versão mais recente
          body: APK gerado automaticamente a cada atualização, assinado digitalmente. Baixe o arquivo .apk abaixo.
          files: ${{ steps.assinar_apk.outputs.signedReleaseFile }}
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
