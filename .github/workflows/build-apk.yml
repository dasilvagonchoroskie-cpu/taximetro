# Taximetro em Flutter: analisa, roda os testes da cobranca e da licenca,
# assina com a MESMA chave do taximetro original (instala por cima do app
# que o cliente ja tem) e publica o APK em Releases.
name: Montar APK do Taximetro

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.5'
  JAVA_VERSION: '17'

jobs:
  apk:
    name: Analisar, testar e montar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Baixar dependencias
        run: flutter pub get

      - name: Analise estatica (flutter analyze)
        run: flutter analyze

      # Cobranca (franquia, o que der mais) e licenca (assinatura e codigo
      # do aparelho). Se alguem quebrar uma delas, o APK nem e gerado.
      - name: Testes automaticos (flutter test)
        run: flutter test

      - name: Chave de assinatura original do taximetro
        env:
          CHAVE: ${{ secrets.TAXIMETRO_KEYSTORE_BASE64 }}
          SENHA: ${{ secrets.TAXIMETRO_KEYSTORE_SENHA }}
        run: |
          if [ -z "$CHAVE" ] || [ -z "$SENHA" ]; then
            echo "::error::Faltam os segredos TAXIMETRO_KEYSTORE_BASE64 / TAXIMETRO_KEYSTORE_SENHA."
            exit 1
          fi
          echo "$CHAVE" | base64 -di > "$RUNNER_TEMP/taximetro.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=taximetro\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/taximetro.jks" "$SENHA" "$SENHA" > android/key.properties

      # Numero da versao sempre acima do app antigo (versionCode 6).
      - name: Montar o APK
        run: |
          NUMERO=$((1000 + ${{ github.run_number }}))
          flutter build apk --release --build-name=3.0.0 --build-number=$NUMERO
          cp build/app/outputs/flutter-apk/app-release.apk "taximetro-$NUMERO.apk"
          echo "APK=taximetro-$NUMERO.apk" >> "$GITHUB_ENV"

      - name: Guardar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: taximetro-apk
          path: ${{ env.APK }}

      - name: Publicar o APK como Release (link direto, sem login)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-mais-recente
          name: Taximetro - versao mais recente
          body: APK gerado automaticamente a cada atualizacao, assinado com a chave original do taximetro (instala por cima). Baixe o arquivo .apk abaixo.
          files: ${{ env.APK }}
          prerelease: true
