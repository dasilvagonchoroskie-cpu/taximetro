name: Compilar APK do Taxímetro

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install

      - name: Sincronizar projeto Android (Capacitor)
        run: npx cap sync android

      - name: Permitir execução do Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publicar o APK pronto (como artefato do build)
        uses: actions/upload-artifact@v4
        with:
          name: taximetro-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar o APK como Release (link direto, sem precisar de login)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-mais-recente
          name: Taxímetro — versão mais recente
          body: APK gerado automaticamente a cada atualização. Baixe o arquivo .apk abaixo.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
