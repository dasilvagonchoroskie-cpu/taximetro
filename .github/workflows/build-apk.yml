name: Compilar APK do Taximetro

# Taximetro em Flutter (versao 3). A cada envio: analise do codigo, testes
# da regra de cobranca e APK assinado com a MESMA chave da versao antiga.
# Assim o Android atualiza por cima e a licenca do aparelho continua valendo
# (o codigo do aparelho vem do ANDROID_ID, que depende da chave).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  FLUTTER_VERSION: '3.47.5'
  JAVA_VERSION: '17'
  # Impressao digital da chave do taximetro (a do app que ja esta na rua).
  CHAVE_ESPERADA: '8bf1414aed3f5f49'

jobs:
  apk:
    name: Validar, testar e compilar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Preparar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Baixar dependencias
        run: flutter pub get

      - name: Analise estatica (flutter analyze)
        run: |
          set -o pipefail
          if ! flutter analyze 2>&1 | tee analise.log; then
            grep -E " error | warning | info |error -|warning -|info -" analise.log | head -40 | while IFS= read -r l; do echo "::error title=flutter analyze::$l"; done
            exit 1
          fi

      - name: Testes da regra de cobranca (flutter test)
        run: |
          set -o pipefail
          if ! flutter test 2>&1 | tee teste.log; then
            grep -E "FAILED|\[E\]|Expected:|Actual:|Error:|error:|Exception|Which:" teste.log | head -40 | while IFS= read -r l; do echo "::error title=flutter test::$l"; done
            exit 1
          fi

      - name: Preparar a chave de assinatura (a mesma da versao antiga)
        env:
          CHAVE: ${{ secrets.TAXIMETRO_KEYSTORE_BASE64 }}
          SENHA: ${{ secrets.TAXIMETRO_KEYSTORE_SENHA }}
        run: |
          if [ -z "$CHAVE" ] || [ -z "$SENHA" ]; then
            echo "ERRO: faltam os segredos da chave do taximetro"; exit 1
          fi
          echo "$CHAVE" | base64 -d > "$RUNNER_TEMP/taximetro.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/taximetro.jks" "$SENHA" "taximetro" "$SENHA" > android/key.properties

      - name: Compilar APK de release assinado
        run: |
          NUMERO=$((1000 + ${{ github.run_number }}))
          set -o pipefail
          if ! flutter build apk --release --build-number=$NUMERO 2>&1 | tee build.log; then
            grep -E "^e: |error:|What went wrong|FAILURE" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error title=flutter build::$l"; done
            exit 1
          fi
          mkdir -p saida
          cp build/app/outputs/flutter-apk/app-release.apk saida/taximetro.apk
          echo "$(grep '^version:' pubspec.yaml) | codigo de versao: $NUMERO"

      - name: Conferir que a chave e a do taximetro (senao nao publica)
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs saida/taximetro.apk | tee assinatura.txt
          if ! grep -qi "SHA-256 digest: $CHAVE_ESPERADA" assinatura.txt; then
            echo "ERRO: o APK nao saiu com a chave do taximetro. Nao publico."; exit 1
          fi
          echo "Chave conferida: e a mesma do app que esta na rua."

      - name: Publicar o APK pronto (artefato)
        uses: actions/upload-artifact@v4
        with:
          name: taximetro-apk
          path: saida/taximetro.apk

      - name: Publicar como Release (link direto, sem precisar de login)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-mais-recente
          name: Taximetro - versao mais recente
          body: Taximetro em Flutter (versao 3). Assinado com a mesma chave da versao anterior, instala por cima e a licenca continua valendo.
          files: saida/taximetro.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
