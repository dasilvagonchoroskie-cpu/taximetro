# TEMPORARIO (apagado antes de juntar na main): aplica o pacote de
# alteracoes, recria o pubspec.lock, testa, compila e grava no proprio ramo.
name: Aplicar envio (temporario)
on:
  push:
    branches: ['claude/empresa-cnpj-3.4.0']
    paths: ['.github/workflows/aplicar-envio.yml']

jobs:
  aplicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
      - name: Aplicar as alteracoes
        run: |
          git apply --recount -C1 --verbose .envio/mudancas.patch
          rm -rf .envio
      - name: Atualizar as bibliotecas
        run: flutter pub upgrade
      - name: Analise e testes
        run: |
          flutter analyze
          flutter test
      - name: Gravar no ramo
        run: |
          git config user.name "acoes"
          git config user.email "acoes@local"
          git add -A -- . ':!.github'
          git commit -m "3.4.0: empresa e CNPJ; bibliotecas atualizadas"
          git push
      - name: Ensaio de compilacao (chave de teste, nada e publicado)
        run: flutter build apk --release
